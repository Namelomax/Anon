# nginx-сайт для бэкенда анонимайзера.
#
#   sudo cp deploy/nginx-anonymizer.conf /etc/nginx/sites-available/anonymizer
#   # заменить ПОДДОМЕН на настоящее имя
#   sudo ln -s /etc/nginx/sites-available/anonymizer /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ПОДДОМЕН      # сертификат и redirect допишет сам
#
# Certbot после выпуска сам добавит сюда listen 443 ssl, пути к сертификатам и
# редирект с 80 на 443 — этот файл описывает состояние ДО него.

server {
    listen 80;
    listen [::]:80;
    server_name ПОДДОМЕН;

    # Документы уходят на бэкенд в base64, а он раздувает объём примерно на
    # треть: .docx на 20 МБ превращается в ~27 МБ JSON. Дефолт nginx — 1 МБ,
    # с ним загрузка обычного договора отвалится с 413.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Синхронный /anonymize-file на большом документе может считаться
        # минуты. Асинхронный путь (/jobs/...) отвечает мгновенно, но старые
        # синхронные эндпоинты никуда не делись и ими пользуется
        # remote_client.py, поэтому запас нужен.
        proxy_connect_timeout 15s;
        proxy_send_timeout   320s;
        proxy_read_timeout   320s;

        # Ответ с документом отдаём как есть, без промежуточной буферизации
        # на диск — тела крупные, а /jobs/<id> отдаёт весь результат разом.
        proxy_buffering off;
    }
}
